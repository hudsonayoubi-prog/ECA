<title>Education Channel Audit Tool (ECA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: left navy rail on desktop, bottom bar on phones; white working surface; cards only where a thing is an object */
:root{
  --brand:#0B2A5B;        /* deep blue: nav, headings, primary, selected */
  --brand-2:#163E80;      /* hover / pressed */
  --brand-tint:#E8EEF8;   /* selected backgrounds */
  --accent:#F2B705;       /* yellow: due soon, highlights (restrained) */
  --accent-ink:#5C4500;   /* text on yellow tints */
  --accent-tint:#FFF5D1;
  --danger:#C8102E;       /* red: overdue, destructive, errors */
  --danger-ink:#9B0B22;
  --danger-tint:#FDE8EB;
  --good:#1E7B45;         /* green: completed / on track only */
  --good-tint:#E3F4EA;
  --none-tint:#F1F2F5;
  --bg:#FFFFFF;           /* dominant white */
  --canvas:#F5F6F9;       /* light grey page ground */
  --surface:#FFFFFF;
  --surface-2:#F8F9FB;
  --line:#E2E5EC;
  --line-strong:#C9CED9;
  --ink:#0F1A2E;
  --ink-2:#4A5568;
  --ink-3:#6B7385;
  --on-brand:#FFFFFF;
  --shadow:0 1px 2px rgba(15,26,46,.06),0 4px 14px rgba(15,26,46,.06);
  --radius:12px; --radius-sm:8px; --pill:999px;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --nav-w:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#8FB2F0;--brand-2:#B4CBF5;--brand-tint:#1A2A47;--accent:#F2C230;--accent-ink:#FFE79A;--accent-tint:#3A3010;
  --danger:#FF6B7F;--danger-ink:#FF9AA8;--danger-tint:#3D1219;--good:#5CCB8A;--good-tint:#123222;--none-tint:#222838;
  --bg:#0E1422;--canvas:#0A0F1A;--surface:#131B2C;--surface-2:#182236;--line:#26324A;--line-strong:#34425E;
  --ink:#EDF1F8;--ink-2:#B5BFD1;--ink-3:#8C97AD;--on-brand:#0A1430;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#8FB2F0;--brand-2:#B4CBF5;--brand-tint:#1A2A47;--accent:#F2C230;--accent-ink:#FFE79A;--accent-tint:#3A3010;
  --danger:#FF6B7F;--danger-ink:#FF9AA8;--danger-tint:#3D1219;--good:#5CCB8A;--good-tint:#123222;--none-tint:#222838;
  --bg:#0E1422;--canvas:#0A0F1A;--surface:#131B2C;--surface-2:#182236;--line:#26324A;--line-strong:#34425E;
  --ink:#EDF1F8;--ink-2:#B5BFD1;--ink-3:#8C97AD;--on-brand:#0A1430;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);color:var(--brand);margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600;font-family:var(--font)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
a{color:var(--brand)}
/* shell */
.shell{display:flex;min-height:100%}
.rail{position:fixed;inset:0 auto 0 0;width:var(--nav-w);background:var(--brand);color:#fff;display:flex;flex-direction:column;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));gap:6px;z-index:20}
:root[data-theme="dark"] .rail{background:#0B1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rail{background:#0B1530}}
.wordmark{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;letter-spacing:.3px;padding:4px 10px 14px;color:#fff}
.wordmark span{display:block;font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#C8D6F2;margin-top:6px}
.rail .start{margin:4px 4px 12px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#D6E0F5;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn[aria-current="page"]{background:#fff;color:#0B2A5B;font-weight:600}
.navbtn svg{flex:none}
.rail .grow{flex:1}
.who{border-top:1px solid rgba(255,255,255,.14);padding:12px 10px 0;font-size:13px;color:#C8D6F2}
.who b{color:#fff;display:block;font-size:14px}
.main{flex:1;min-width:0;margin-left:var(--nav-w);display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:60px}
.topbar .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.content{width:100%;max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.bottombar{display:none}
@media (max-width:1023px){
  .rail{display:none}
  .main{margin-left:0}
  .topbar{padding:10px 16px}
  .content{padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottombar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 2px;border-radius:10px;cursor:pointer;min-height:48px}
  .bottombar button[aria-current="page"]{color:var(--brand);background:var(--brand-tint)}
  .bottombar .fab{background:var(--brand);color:var(--on-brand);border-radius:14px;margin:0 4px}
  .bottombar .fab[aria-current="page"]{background:var(--brand-2);color:var(--on-brand)}
}
.page-title{font-family:var(--display);font-weight:600;color:var(--brand);font-size:18px;overflow:hidden;text-overflow:ellipsis}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:var(--on-brand)}
.btn.start-cta{background:var(--accent);border-color:var(--accent);color:#1D1600;width:100%;font-size:15px;min-height:46px}
.btn.start-cta:hover{filter:brightness(1.04);color:#1D1600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger-ink);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-tint)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-2)}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--danger-ink);font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.input[aria-invalid="true"]{border-color:var(--danger);background:var(--danger-tint)}
.search{position:relative;min-width:0;width:100%}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:36px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(15,26,46,.12)}
.seg.big{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.big button{min-height:46px;font-size:15px}
.seg.big button[aria-pressed="true"].yes{background:var(--good-tint);color:var(--good)}
.seg.big button[aria-pressed="true"].no{background:var(--none-tint);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:34px}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .field{flex:0 1 190px}
.content>*{min-width:0}
@media (max-width:640px){.toolbar .field{flex:1 1 calc(50% - 10px)}.toolbar .field.wide{flex-basis:100%}.hide-m{display:none!important}.toolbar .field.fit{flex:1 1 100%}}
.stepper{scrollbar-width:thin}
.toolbar .field.fit{flex:0 0 auto;max-width:100%}
.seg{flex-wrap:wrap;max-width:100%}
/* status chips: colour + icon + text */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--pill);padding:2px 9px 2px 7px;font-size:12px;font-weight:700;white-space:nowrap;line-height:20px;border:1px solid transparent}
.chip svg{flex:none}
.chip.good{background:var(--good-tint);color:var(--good)}
.chip.warn{background:var(--accent-tint);color:var(--accent-ink);border-color:var(--accent)}
.chip.bad{background:var(--danger-tint);color:var(--danger-ink)}
.chip.none{background:var(--none-tint);color:var(--ink-2);border-color:var(--line-strong);border-style:dashed}
.chip.muted{background:transparent;color:var(--ink-3);border-color:var(--line)}
.chip.type{background:var(--brand-tint);color:var(--brand);font-weight:600}
.chip.plain{background:var(--surface-2);color:var(--ink-2);border-color:var(--line);font-weight:600}
/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;color:var(--ink)}
.kpi .l{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.bad .v{color:var(--danger-ink)} .kpi.warn .v{color:var(--accent-ink)} .kpi.good .v{color:var(--good)}
.kpi.bad{border-left:4px solid var(--danger)} .kpi.warn{border-left:4px solid var(--accent)} .kpi.good{border-left:4px solid var(--good)} .kpi.none{border-left:4px dashed var(--line-strong)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h p{margin:4px 0 0;color:var(--ink-2)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main-c{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn{all:unset;display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid var(--line);cursor:pointer;min-width:0;border-radius:8px}
.rowbtn:hover{background:var(--surface-2)}
.rowbtn:focus-visible{outline:3px solid var(--accent)}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vcard.bad{border-top:3px solid var(--danger)} .vcard.warn{border-top:3px solid var(--accent)} .vcard.good{border-top:3px solid var(--good)} .vcard.none{border-top:3px dashed var(--line-strong)}
.vcard .name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.due-big{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.due-big.bad{color:var(--danger-ink)} .due-big.warn{color:var(--accent-ink)} .due-big.good{color:var(--good)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:4px}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ucard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ucard:hover{border-color:var(--brand)}
.ucard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface-2);border-radius:8px;padding:8px}
.stats b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.stats span{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
.section-t{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px}
.dl div{min-width:0} .dl dt{font-size:12px;color:var(--ink-3);font-weight:600} .dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.rg{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:16px;position:relative}
.timeline li::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dotc{width:18px;height:18px;border-radius:50%;border:3px solid var(--brand);background:var(--surface);margin-top:2px}
.timeline .dotc.good{border-color:var(--good)} .timeline .dotc.muted{border-color:var(--line-strong)} .timeline .dotc.bad{border-color:var(--danger)}
/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,36,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);border-radius:16px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.sheet-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);flex-wrap:wrap}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:16px 16px 0 0;max-height:92%}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:1/-1}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:14px}
.banner.info{background:var(--brand-tint);color:var(--brand)}
.banner.warn{background:var(--accent-tint);color:var(--accent-ink)}
.banner.bad{background:var(--danger-tint);color:var(--danger-ink)}
.banner.good{background:var(--good-tint);color:var(--good)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
@media (max-width:1023px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* stepper */
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:6px 12px 6px 6px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line-strong);font-size:12px}
.step[aria-current="step"]{border-color:var(--brand);color:var(--brand)}
.step[aria-current="step"] i{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.step.done i{background:var(--good-tint);color:var(--good);border-color:var(--good)}
.step.miss i{background:var(--danger-tint);color:var(--danger-ink);border-color:var(--danger)}
.audit-wrap{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
