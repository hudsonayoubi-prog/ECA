name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-pp.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scripts/requirements-pp.txt
          npx playwright install --with-deps chromium

      - name: Prototype end-to-end tests (16 Playwright suites)
        run: npm test

      - name: Power Platform logic tests (schema, import, scoring, summaries, Excel)
        run: npm run test:pp
